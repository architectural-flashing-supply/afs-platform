<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>AFS Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* One committed dark theme. Layers step up in lightness: page < lane/panel < card < raised. Inputs sink darker. */
:root{
--bg:#343D49;--p1:#434E5D;--p2:#52606F;--p3:#657487;--sink:#2C333D;
--line:#66758A;--line2:#8494A8;
--ink:#FFFFFF;--ink2:#E3E8EF;--ink3:#C3CCD8;
--hdr:#2C343F;
--red:#D3182F;--red-h:#E8283F;--redtxt:#FF7A8A;
--green:#2F8F5E;--green-h:#3AA66F;--greentxt:#A5EBC5;--greenbg:#2F5D49;
--blue:#3F83EA;--blue-h:#5A97F5;--bluetxt:#BCD6FF;--bluebg:#33518A;
--amber:#F2B01E;--amber-h:#FFC53F;--ambertxt:#FFD36B;--amberbg:#6B5521;
--violet:#2F94AE;--violet-h:#41A9C3;--violettxt:#BDEBF7;--violetbg:#2F5E70;
--slate:#6B7A8F;--slate-h:#7C8CA2;
--plate:#C4C4C4;--pline:#111111;--hem:#C0001A;--paint:#E39B00;--arc:#2B3A52;
--display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
--body:Barlow,"Helvetica Neue",Arial,sans-serif;
color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid #7DB0FF;outline-offset:2px}
::selection{background:#35507F}
/* prototype strip */
.proto{background:#4E4120;color:#FFE08A;font-size:13px;padding:6px 16px;display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;justify-content:center;text-align:center;border-bottom:1px solid #8A7425}
.proto b{color:#FFD36B}
.proto .tgl{display:inline-flex;gap:6px;align-items:center}
.proto .tgl button{height:24px;padding:0 10px;border-radius:12px;border:1px solid #B89A3C;background:transparent;color:#FFE08A;font-weight:600;cursor:pointer;font-size:12.5px}
.proto .tgl button.on{background:#FFD36B;color:#241B00;border-color:#FFD36B}
.proto .lb{background:none;border:0;color:#FFB2BC;text-decoration:underline;cursor:pointer;font-weight:600}
/* header */
.hdr{background:linear-gradient(180deg,#3A4452,#2C343F);border-bottom:3px solid var(--red);position:sticky;top:env(safe-area-inset-top,0px);z-index:60}
.hdr-in{display:flex;align-items:center;gap:22px;padding:8px 20px;flex-wrap:wrap;max-width:1900px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px;padding-right:22px;border-right:1px solid #66758A}
.brand img{height:46px;width:auto;display:block}
.bt{display:flex;flex-direction:column;line-height:1.05}
.bt b{font-family:var(--display);font-size:25px;font-weight:700;letter-spacing:.09em;color:#fff;text-transform:uppercase}
.bt span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#FF8A98;font-weight:600;margin-top:3px}
.nav{display:flex;gap:2px;background:#252C36;border:1px solid #566275;border-radius:11px;padding:4px;overflow-x:auto}
.nav a{display:flex;align-items:center;gap:8px;height:40px;padding:0 17px;border-radius:8px;color:var(--ink2);font-weight:600;white-space:nowrap;font-size:15.5px}
.nav a:hover{background:#4A5667;color:#fff}
.nav a.on{background:var(--blue);color:#fff}
.cnt{min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
@media(max-width:1250px){.hdr-r{flex-wrap:wrap}}
.hdr-r input{width:250px;max-width:100%;height:38px;border-radius:8px;border:1px solid #8494A8;background:var(--sink);padding:0 12px;color:#fff}
.hdr-r input::placeholder{color:#C0CAD6}
.more{position:relative}
.mbtn{height:38px;padding:0 15px;border-radius:8px;border:1px solid #7A889C;background:#4F5C6E;color:#fff;font-weight:600;cursor:pointer}
.mbtn:hover{background:#5D6B7F}
.mm{position:absolute;right:0;top:44px;background:#4A5667;border:1px solid #8494A8;color:#fff;border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.6);padding:6px;min-width:190px;z-index:70}
.mm a{display:block;padding:10px 12px;border-radius:7px;font-weight:600}
.mm a:hover{background:var(--blue)}
.who{font-weight:600;color:#fff}
.lo{color:var(--ink2);text-decoration:underline;font-size:14px}
.wrap{padding:20px 20px 60px;max-width:1900px;margin:0 auto}
/* buttons: colour = what kind of action */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 16px;border-radius:7px;font-weight:600;font-size:14.5px;border:1px solid transparent;cursor:pointer;white-space:nowrap;color:#fff;position:relative;z-index:2}
.btn.sm{height:30px;padding:0 12px;font-size:13.5px}
.btn.lg{height:42px;padding:0 20px;font-size:16px}
.btn.red{background:var(--red)}.btn.red:hover{background:var(--red-h)}
.btn.green{background:var(--green)}.btn.green:hover{background:var(--green-h)}
.btn.blue{background:var(--blue)}.btn.blue:hover{background:var(--blue-h)}
.btn.amber{background:var(--amber);color:#1C1400}.btn.amber:hover{background:var(--amber-h)}
.btn.violet{background:var(--violet)}.btn.violet:hover{background:var(--violet-h)}
.btn.slate{background:var(--slate);border-color:#8393A8}.btn.slate:hover{background:var(--slate-h)}
.btn.ghost{background:transparent;border-color:#9AA8BA;color:var(--ink)}.btn.ghost:hover{background:#4A5667}
.btn[disabled]{background:#4B5766;color:#B6C0CD;border-color:#5E6B7C;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--bluetxt);font-weight:600;cursor:pointer;text-decoration:underline}
/* panels: depth */
.panel{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel>h2,.ph{font-family:var(--display);font-weight:600;font-size:21px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.inset{background:var(--p2);border:1px solid var(--line);border-radius:9px;padding:12px}
.sink{background:var(--sink);border:1px solid var(--line);border-radius:9px;padding:12px}
h1.t{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.1}
.sub{color:var(--ink2);margin-top:3px}
.hint{color:var(--ink3);font-size:13px;margin-top:6px}
.tag{font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.05em;text-transform:uppercase;background:var(--p3);color:var(--ink2);border-radius:5px;padding:3px 8px;white-space:nowrap}
.tag.blue{background:var(--bluebg);color:var(--bluetxt)}.tag.green{background:var(--greenbg);color:var(--greentxt)}.tag.amber{background:var(--amberbg);color:var(--ambertxt)}.tag.violet{background:var(--violetbg);color:var(--violettxt)}.tag.red{background:#7A2A36;color:var(--redtxt)}
.greet{display:flex;align-items:center;gap:14px 22px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:34px;padding:0 15px;border-radius:17px;background:var(--p2);border:1px solid var(--line2);font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:#B8C4D2}
.chip.go{background:var(--green);border-color:var(--green-h);color:#fff}
.chip.vio{background:var(--violet);border-color:var(--violet-h);color:#fff}
.beacon{width:10px;height:10px;border-radius:50%;background:#7CE6A8;flex:none;animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,240,143,.7)}70%{box-shadow:0 0 0 9px rgba(88,240,143,0)}100%{box-shadow:0 0 0 0 rgba(88,240,143,0)}}
@media(prefers-reduced-motion:reduce){.beacon{animation:none}}
/* workbench */
.wb{display:grid;grid-template-columns:350px minmax(0,1fr);gap:16px;align-items:start}
.wb.noin{grid-template-columns:minmax(0,1fr)}
@media(max-width:1300px){.wb{grid-template-columns:minmax(0,1fr)}}
.inbox{background:var(--p1);border:1px solid var(--line);border-top:4px solid var(--violet);border-radius:12px;padding:14px;position:sticky;top:96px;max-height:calc(100vh - 120px);overflow:auto}
@media(max-width:1300px){.inbox{position:static;max-height:none}}
.inbox h2{font-family:var(--display);font-weight:600;font-size:21px;display:flex;align-items:center;justify-content:space-between}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--greentxt);margin:4px 0 10px;font-weight:600}
.conn i{width:8px;height:8px;border-radius:50%;background:#7CE6A8}
.mrow{display:block;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-left:4px solid var(--line2);border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.mrow:hover{border-color:#B0BDCD;background:#5C6A7C}
.mrow.order{border-left-color:var(--blue)}.mrow.reorder{border-left-color:var(--violet)}.mrow.approval{border-left-color:#6BD39F}.mrow.notice{border-left-color:var(--amber)}.mrow.skip{border-left-color:#8A97A9;opacity:.8}
.mrow .m1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14.5px}
.mrow .m1 span{font-weight:500;color:var(--ink3);font-size:12.5px;white-space:nowrap}
.mrow .m2{font-size:13.5px;color:var(--ink2);margin:2px 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .m3{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.board{overflow-x:auto;padding-bottom:6px}
.lanes{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;align-items:start}
@media(max-width:1500px){.lanes{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.lane{background:var(--p1);border:1px solid var(--line);border-top:4px solid var(--line2);border-radius:12px;padding:12px}
.lane.new{border-top-color:var(--blue)}.lane.quoted{border-top-color:var(--amber)}.lane.approved{border-top-color:#6BD39F}.lane.shop{border-top-color:var(--violet)}.lane.done{border-top-color:#B4C0CE}
.lane-h{padding:2px 4px 10px}
.lane-t{display:flex;align-items:center;justify-content:space-between}
.lane-t h2{font-family:var(--display);font-weight:600;font-size:20px}
.lc{min-width:26px;height:24px;padding:0 8px;border-radius:12px;background:var(--p3);color:#fff;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.lane.approved .lc{background:var(--green)}
.lane-h p{color:var(--ink3);font-size:13px;margin-top:2px}
.cards{display:flex;flex-direction:column;gap:10px}
.empty{padding:14px 6px;color:var(--ink3);font-size:14px}
.card{position:relative;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:9px}
.card:hover{border-color:#B0BDCD;background:#5C6A7C}
.card.appr{background:#35634E;border-color:#4FB47F}
.top{display:flex;gap:12px}
.body{min-width:0;flex:1}
.stretch{font-weight:700;font-size:16px;display:block;line-height:1.25}
.stretch::after{content:"";position:absolute;inset:0;border-radius:10px}
.item{font-size:14.5px;margin-top:3px}
.spec{font-size:13px;color:var(--ink2)}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.meta.warn{color:var(--ambertxt);font-weight:600}.meta.ok{color:var(--greentxt);font-weight:600}
.src{font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:11px;background:#6B7A8F;color:#DDE3EC;border-radius:4px;padding:2px 6px}
.thumb{position:relative;z-index:3;flex:none;display:block;border:0;background:none;padding:0;cursor:pointer}
.pl{display:block;width:68px;height:68px;border-radius:7px;background:var(--plate);border:2px solid #E4E4E4;box-shadow:0 0 0 1px #000}
.thumb.lg .pl{width:92px;height:92px}.thumb.sm .pl{width:52px;height:52px}.thumb.md .pl{width:80px;height:80px}
.pl svg,.rt svg,.dplate svg{width:100%;height:100%;display:block}
/* big profile plates */
.plate{background:var(--plate);border:2px solid #E4E4E4;box-shadow:0 0 0 1px #000;border-radius:9px;color:#111}
.plate svg{width:100%;height:auto;display:block}
.pstrip{display:flex;gap:12px;align-items:flex-start;border-radius:9px;padding:10px 12px;margin-top:10px;font-size:14px}
.pstrip b{display:block}
.pstrip.green{background:var(--greenbg);border:1px solid #4FB47F;color:#E3FBEE}
.pstrip.amber{background:var(--amberbg);border:1px solid #C79A2E;color:#FFE6A3}
.pstrip.blue{background:var(--bluebg);border:1px solid #6C9CE6;color:#E4EEFF}
.pstrip .btn{margin-top:8px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink3);margin-top:8px}
.leg i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
#gpeek{position:fixed;display:none;z-index:500;background:#3B4552;border:1px solid #A9B6C6;border-radius:12px;box-shadow:0 22px 54px rgba(0,0,0,.7);padding:12px;pointer-events:none;color:var(--ink)}
#gpeek .pk{display:block;background:var(--plate);border-radius:8px;border:2px solid #E4E4E4}
#gpeek .pk svg{width:100%;height:auto;display:block}
#gpeek b{display:block;margin-top:9px;font-size:15px}
#gpeek i{display:block;font-style:normal;color:var(--ink2);font-size:13px}
.foot{margin-top:16px;color:var(--ink3);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
.crumb{background:none;border:0;padding:0;cursor:pointer;color:var(--bluetxt);font-weight:600;font-size:14.5px;display:inline-block;margin-bottom:8px}
.crumb:hover{text-decoration:underline}
/* job */
.jh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:16px;flex-wrap:wrap}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{height:32px;padding:0 14px;border-radius:16px;background:var(--p2);border:1px solid var(--line2);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;color:var(--ink3)}
.step.done{background:var(--greenbg);border-color:#4FB47F;color:var(--greentxt)}
.step.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1250px){.cols{grid-template-columns:minmax(0,1fr)}}
.from{color:var(--ink2);font-size:14px;margin-bottom:8px}
.mail{background:var(--sink);border:1px solid var(--line);border-radius:9px;padding:13px;font-size:14.5px;color:#E5EAF2}
.att{display:inline-flex;align-items:center;margin-top:10px;min-height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:7px;font-size:14px;background:var(--p2)}
.read{margin-top:16px}
.read h3{font-weight:700;font-size:15px;margin-bottom:6px}
.row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:7px;font-size:14.5px}
.row+.row{border-top:1px solid var(--line)}
.row .k{color:var(--ink3)}
.row.unsure{background:var(--amberbg);border-top-color:transparent;outline:1px solid #C79A2E}
.row.unsure .k,.row.unsure .v{color:#FFE6A3}
.sure{color:var(--greentxt);font-weight:700;font-size:13px}
.note{font-size:13px;color:var(--ink3);margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);padding:7px 8px;border-bottom:1px solid var(--line2)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
input.f,select.f,textarea.f{background:var(--sink);border:1px solid var(--line2);border-radius:7px;color:var(--ink);padding:0 10px;height:36px;width:100%}
textarea.f{height:auto;padding:10px;min-height:90px;resize:vertical;line-height:1.45}
input.f.need{border:2px solid var(--amber);background:#5E4B1E}
input.f::placeholder,textarea.f::placeholder{color:#C0CAD6}
.eng{background:var(--violetbg);border:1px solid #5AB3CC;border-radius:9px;padding:12px;margin-top:10px;font-size:13.5px;color:#E1F6FB}
.eng b.big{font-size:18px;color:#fff}
.eng .three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.eng label.l{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--violettxt);margin-bottom:3px}
.needbox{background:var(--amberbg);border:1px solid #C79A2E;color:#FFE6A3;border-radius:9px;padding:12px;font-size:13.5px;margin-top:10px}
.tot td{border:0;padding:4px 8px}
.tot .big td{font-weight:700;font-size:18px;border-top:1px solid var(--line2);padding-top:10px}
.mailp{background:var(--sink);border:1px solid var(--line);border-radius:9px;padding:12px 14px;font-size:13.5px;margin-top:12px;color:#DCE2EB}
.apv{display:inline-block;margin-top:6px;background:var(--green);color:#fff;border-radius:5px;padding:4px 10px;font-weight:700;font-size:12.5px}
.actions{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.chk i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-style:normal;font-size:13px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.chk i.w{background:var(--amber);color:#1C1400}
.chk small{display:block;color:var(--ink3);font-size:13px}
.big-note{background:var(--greenbg);border:1px solid #4FB47F;color:#E3FBEE;border-radius:9px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.wait{background:var(--p2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;margin-bottom:12px}
.notes{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.nt{background:#5E4B1E;border-left:4px solid var(--amber);border-radius:6px;padding:8px 12px;font-size:14px;color:#FFEBB5}
.nt small{display:block;color:#E6CF86;font-size:12px;margin-bottom:2px}
dl.sp{display:grid;grid-template-columns:98px 1fr;gap:6px 10px;font-size:14.5px;margin:12px 0}
dl.sp dt{color:var(--ink3)}dl.sp dd{margin:0;font-weight:600}
.past{margin-top:16px}
.past h3{font-weight:700;font-size:15px;margin-bottom:8px}
.pt{display:flex;gap:10px;flex-wrap:wrap}
/* source */
.split{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr);align-items:start}
@media(max-width:1000px){.split{grid-template-columns:minmax(0,1fr);gap:16px}.grip{display:none}}
.grip{align-self:stretch;display:flex;align-items:center;justify-content:center}
.grip i{display:block;width:4px;height:56px;border-radius:2px;background:#8393A8}
dl.meta2{display:grid;grid-template-columns:70px 1fr;gap:3px 10px;font-size:14px;margin:0 0 10px}
dl.meta2 dt{color:var(--ink3)}dl.meta2 dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.mailv{background:var(--sink);border:1px solid var(--line);border-radius:9px;padding:14px;font-size:15.5px;line-height:1.65;color:#E9EDF4}
.mark{background:none;border:0;border-bottom:2px dotted #C0CBD8;padding:0 1px;font:inherit;color:inherit;cursor:pointer}
.mark:hover{background:#66758A}
.mark.on{background:#FFD36B;color:#241B00;border-bottom:2px solid var(--red);font-weight:700}
.tabs{display:flex;gap:6px;margin:14px 0 8px;flex-wrap:wrap}
.tab{height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--line2);background:var(--p2);font-size:13.5px;font-weight:600;cursor:pointer}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sheet{position:relative;background:#F4F1E8;border:1px solid #8E8A7A;border-radius:6px;aspect-ratio:480/300;max-width:560px;width:100%;color:#2B2B2B}
.sheet svg{position:absolute;inset:0;width:100%;height:100%}

.who{white-space:nowrap}.lo{white-space:nowrap}

.brand{padding-right:14px;gap:10px}
.brand img{height:34px}
.bt b{font-size:16px;letter-spacing:.08em}
.nqb{height:40px;padding:0 18px;border-radius:9px;border:0;background:var(--red);color:#fff;font-weight:700;font-size:15.5px;cursor:pointer;white-space:nowrap;font-family:var(--body)}
.nqb:hover{background:var(--red-h)}
.nav a{padding:0 10px;font-size:14.5px;height:38px}
.nav{flex:none}
.bt b{white-space:nowrap}
@media(max-width:1560px){.who{display:none}}
@media(max-width:1250px){.bt{display:none}.brand{padding-right:10px}}
.hs{position:relative;flex:1 1 150px;min-width:130px;max-width:340px}
.hdr-r .hs input{width:100%}
.hsd{position:absolute;right:0;top:44px;width:min(640px,92vw);background:#fff;color:var(--ink);border:1px solid var(--line2);border-radius:10px;box-shadow:0 18px 44px rgba(15,19,24,.32);padding:6px;z-index:90;max-height:72vh;overflow:auto}
.hsr{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-radius:8px;padding:6px;cursor:pointer;color:var(--ink)}
.hsr:hover{background:#EEF1F5}
.hsr .rt{width:46px;height:46px;flex:none;background:var(--plate);border:1px solid #AEB6C2;border-radius:6px;display:block}
.hsr .rt svg{width:100%;height:100%;display:block}
.hsr .tx{display:flex;flex-direction:column;min-width:0}
.hsr .tx span{font-size:13px;color:var(--ink3)}
.hsc{display:flex;gap:10px;align-items:center;padding:8px;border-bottom:1px solid #D5DAE1}
.hsc span{color:var(--ink3);margin-right:auto}
.hsall{width:100%;margin-top:4px;height:38px;border:0;border-radius:8px;background:var(--ch);color:#fff;font-weight:600;cursor:pointer}
.hsn{padding:12px;color:var(--ink3)}
/* result rows (search) and list rows (quotes, orders) */
.rcount{margin:2px 0 10px;font-weight:600;color:var(--ink3)}
.fchip{display:flex;gap:10px;align-items:center;margin-bottom:10px;font-weight:600}
.rtab,.ltab{display:flex;flex-direction:column;gap:8px}
.rh,.lh{display:grid;gap:12px;padding:0 12px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.rr,.lr{display:grid;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;box-shadow:0 1px 2px rgba(15,19,24,.06)}
.lr{cursor:pointer}.lr:hover{border-color:var(--line2)}
.rh,.rr{grid-template-columns:84px minmax(150px,1.3fr) minmax(130px,1fr) minmax(120px,.9fr) minmax(170px,1.1fr) minmax(110px,.7fr) 190px}
.lh,.lr{grid-template-columns:90px minmax(140px,1.1fr) minmax(150px,1.2fr) minmax(150px,1.1fr) minmax(110px,.8fr) minmax(150px,1fr) minmax(90px,.6fr) 140px}
.rr .rt,.lr .rt,.pcard .rt{display:block;background:var(--plate);border:1px solid #AEB6C2;border-radius:8px;aspect-ratio:1}
.rr .rt svg,.lr .rt svg,.pcard .rt svg{width:100%;height:100%;display:block}
.pcard .rt{aspect-ratio:4/3}
.rr>div,.lr>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.rr b,.lr b{font-weight:700}
.rr span,.lr span{font-size:13.5px;color:var(--ink2)}
.rr .mut,.lr .mut,.pcard .mut{color:var(--ink3);font-size:12.5px}
.rr .c6,.lr .c6{flex-direction:row;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.rr .c6 .btn,.lr .c6 .btn{margin-top:0}
.lr .c7{align-items:flex-start}
.lr .c7 .pill{margin-bottom:2px}
@media(max-width:1180px){.rh,.lh{display:none}.rr,.lr{grid-template-columns:84px 1fr 1fr}.rr .c6,.lr .c6{grid-column:1/-1;justify-content:flex-start}}
@media(max-width:620px){.rr,.lr{grid-template-columns:70px 1fr}}
/* New quote */
.nqg{display:grid;grid-template-columns:400px minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:980px){.nqg{grid-template-columns:minmax(0,1fr)}}
.nql .clist{max-height:60vh;overflow:auto}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(15,19,24,.06)}
.pcard .btn{margin-top:4px;align-self:flex-start}
.frm{display:grid;gap:12px;max-width:460px;margin-top:12px}
.frm2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* deliveries split */
.dsplit{display:grid;grid-template-columns:minmax(360px,1fr) minmax(440px,1.15fr);gap:16px;align-items:start}
.dsplit.fl,.dsplit.fm{grid-template-columns:minmax(0,1fr)}
.dsplit.fl .dright,.dsplit.fm .dleft{display:none}
@media(max-width:1000px){.dsplit{grid-template-columns:minmax(0,1fr)}}
.dpanel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(15,19,24,.06)}
.dph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dph h2{font-family:var(--display);font-size:22px;font-weight:600;margin-right:auto}
.dph .btn{margin-top:0}
.dlist{display:flex;flex-direction:column;gap:12px}
.dsplit.fl .dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));align-items:start}
.dlist .day{min-height:0;background:var(--p1)}
.dlist .un{background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:12px}
.dcard{cursor:pointer}
.dcard.sel{outline:3px solid var(--red);outline-offset:1px}
.live{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;color:var(--greentxt)}
.live i{width:9px;height:9px;border-radius:50%;background:#1E8E52;display:inline-block;animation:pulse 1.8s infinite}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dtab{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);background:#fff;font-weight:600;cursor:pointer;font-size:13.5px;color:var(--ink)}
.dtab.on{background:var(--ch);color:#fff;border-color:var(--ch)}
.mapwrap svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px}
.dsplit.fm .mapwrap{max-width:1000px;margin:0 auto}
.dright{position:sticky;top:78px}
.dsplit.fm .dright{position:static}
.trk{display:flex;gap:10px;align-items:baseline;margin:10px 0 6px;padding:8px 10px;background:var(--p1);border-radius:8px}
.trk span{color:var(--ink2)}
.trows{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.trow.sel{outline:3px solid var(--red);outline-offset:1px}
.trow .num{width:26px;height:26px;border-radius:50%;background:var(--ch);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.trow .tx{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.trow .tx span{font-size:13px;color:var(--ink3)}
/* change orders, reconciliation */
.recon{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
.recon h3{font-size:14px;margin-bottom:8px;letter-spacing:.02em}
.recon table{width:100%;border-collapse:collapse}
.recon td{padding:6px 0;border-bottom:1px solid #D5DAE1}
.recon td.n{text-align:right;font-variant-numeric:tabular-nums}
.recon tr.big td{font-weight:700;border-bottom:0}
.pill.a{white-space:normal}
@media(max-width:900px){.hdr-in{flex-wrap:wrap}.nav{flex:0 1 100%;max-width:100%;overflow-x:auto}.hdr-r{flex:1 1 100%;justify-content:flex-start}.hs{max-width:none}}

      (j.inv ? '<div class="chk"><i>✓</i><div>Invoice #' + j.inv.no + ' emailed to ' + esc(first) + ' at ' + esc(j.inv.at) + '<small>Final invoice and reconciliation went to Tricia at the same time</small></div></div>' : '<div class="chk"><i class="w">•</i><div>Invoice goes to ' + esc(first) + ' when the shop marks it finished<small>Tricia gets the final invoice with a reconciliation at the same moment</small></div></div>') +

}
function rangeCut(r) { return r === '30' ? NOW - 30 * 864e5 : r === '90' ? NOW - 90 * 864e5 : r === 'year' ? new Date(2026, 0, 1).getTime() : 0; }

function rowOfJob(j) {

}

function sortRows(rows, how) {
  var f = {
    new: function (a, b) { return b.ts - a.ts; }, old: function (a, b) { return a.ts - b.ts; },
    cust: function (a, b) { return a.cust.localeCompare(b.cust) || b.ts - a.ts; },
    qty: function (a, b) { return b.qty - a.qty || b.ts - a.ts; }, val: function (a, b) { return b.tot - a.tot || b.ts - a.ts; }
  }[how] || function (a, b) { return b.ts - a.ts; };

}
function matchTokens(r, q) {

  return toks.every(function (t) { return hay.indexOf(t) >= 0; });
}

/* ================= peek (hover enlarge, with dimensions) ================= */
var gp = document.getElementById('gpeek');
function hidePeek() { gp.style.display = 'none'; }
function peekData(el) {
  var jb = el.getAttribute('data-job'), pd = el.getAttribute('data-pid'), j, p;
  if (jb) { j = jobBy(jb); if (!j) return null; var st = jobSt(j), ps = pState(j); return { kind: j.kind, d: jobDims(j), hi: jobHi(j), paint: j.paint, t: NAMES[j.kind] + ' · ' + j.cust, s: dimTxt(j.kind, jobDims(j)), s2: bendTxt(st) + ' · ' + fmtIn(st.dev) + ' developed · ' + j.spec, n: ps === 'change' ? 'Requested change: ' + chgLine(j) : ps === 'none' ? 'Not saved yet: parser\'s reading of the sketch' : ps === 'newver' ? 'New version, saved in FlashDraft' : 'Exactly as saved in FlashDraft' }; }
  if (pd) { p = profBy(pd); if (!p) return null; var s2 = stats(p.kind, p.d); return { kind: p.kind, d: p.d, hi: [], paint: p.paint, t: NAMES[p.kind] + ' · ' + p.cust, s: dimTxt(p.kind, p.d), s2: bendTxt(s2) + ' · ' + fmtIn(s2.dev) + ' developed · ' + p.mats.length + ' material' + (p.mats.length === 1 ? '' : 's'), n: 'Exactly as saved in FlashDraft (profile #' + p.id + ')' }; }
  return null;
}
function showPeek(el) {
  var d = peekData(el); if (!d) return;
  var w = 440;
  gp.innerHTML = '<span class="pk">' + draw(d.kind, d.d, { w: 440, h: 290, dims: true, ang: true, paint: d.paint, hi: d.hi, fs: 17, sw: 4.6 }) + '</span><b>' + esc(d.t) + '</b><i>' + esc(d.s) + '</i><i>' + esc(d.s2) + '</i><i style="color:var(--ambertxt)">' + esc(d.n) + '</i>';
  gp.style.width = w + 'px'; gp.style.display = 'block';
  var r = el.getBoundingClientRect(), h = gp.offsetHeight, x = r.right + 12;
  if (x + w > window.innerWidth - 8) x = r.left - w - 12;
  if (x < 8) x = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  var y = Math.max(8, Math.min(r.top - 8, window.innerHeight - h - 8));
  if (x < r.right && x + w > r.left && y < r.bottom && y + h > r.top) y = Math.min(window.innerHeight - h - 8, r.bottom + 8);
  gp.style.left = x + 'px'; gp.style.top = y + 'px';
}
function peekTarget(e) { return e.target && e.target.closest ? e.target.closest('[data-pid],[data-job]') : null; }
document.addEventListener('mouseover', function (e) { var t = peekTarget(e); if (t) showPeek(t); else hidePeek(); });
document.addEventListener('focusin', function (e) { var t = peekTarget(e); if (t) showPeek(t); });
document.addEventListener('focusout', hidePeek);
window.addEventListener('scroll', hidePeek, true);

}
function approve(j, how) {

}

  logout: function () { toast('This is a prototype, so there is nothing to sign out of.'); },
  reset: function () { CUSTS.length = CUSTS_N; S = seed(); S.eng.mats = engBlank(); document.documentElement.style.setProperty('--pline', '#111111'); syncLineBtns(); render(); window.scrollTo(0, 0); toast('Demo reset to the starting state.'); },
  line: function (el) { S.line = el.dataset.v; document.documentElement.style.setProperty('--pline', S.line === 'red' ? '#C0001A' : '#111111'); syncLineBtns(); hidePeek(); },
  open: function (el) { go('job', Number(el.dataset.id)); },
  toLane: function (el) { var l = document.getElementById('lane-' + el.dataset.v); if (l) l.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }); },
  toInbox: function () { var l = document.getElementById('inbox'); if (l) l.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  checkMail: function () { toast('Checked Outlook just now. ' + S.inbox.filter(function (m) { return m.st === 'new'; }).length + ' emails are waiting for you.'); },
  mailOpen: function (el) { S.modal = { type: 'mail', id: Number(el.dataset.id) }; render(); },
  mailGo: function (el) {
    var m = S.inbox.filter(function (x) { return x.id === Number(el.dataset.id); })[0]; S.modal = null;
    if (m.st === 'job') { go('job', m.job); return; }
    if (m.type === 'order' || m.type === 'reorder') {
      var x = m.make, j = makeJob({ cust: m.co, kind: x.kind, pid: x.pid, qty: x.qty, spec: x.spec, sketchD: x.sketchD || null, att: m.att, mailBody: m.body, recv: 'Thu, Oct 1, ' + m.time });
      m.st = 'job'; m.job = j.n; log('Email read: ' + m.co + ', ' + m.subj + '. Draft job ' + jid(j.n) + ' created in New');
      go('job', j.n); toast('Draft job ' + jid(j.n) + ' created from the email. No price set, nothing sent.'); return;
    }
    if (m.type === 'approval') { var jb = jobBy(m.job); if (jb && jb.lane === 'quoted') approve(jb, 'by email just now'); m.st = 'done'; render(); toast(m.who + ' approved by email. ' + jid(m.job) + ' moved to Approved. Tricia\'s estimate moved from pending to approved.'); return; }
    if (m.type === 'notice') { log('Supplier notice recorded: ' + m.co + ', ' + m.subj); m.st = 'done'; render(); toast('Recorded in the pricing history.'); return; }
    m.st = 'done'; render();
  },
  confirmColor: function () { var j = jobBy(S.route.id); j.colorOk = true; render(); toast('Color confirmed as Charcoal Kynar.'); },
  draft: function () { var j = jobBy(S.route.id); log('Draft estimate saved: ' + j.cust + ', ' + itemLabel(j) + (totals(j).has ? ', ' + cents(totals(j).tot) : ', no price yet')); toast('Draft saved. It stays in New.'); },
  sendQuote: function () {
    var j = jobBy(S.route.id), t = totals(j); if (!t.has) return;
    log('Quote sent to ' + j.person + ', ' + j.cust + ': ' + j.qty + ' × ' + NAMES[j.kind] + ' ' + dimTxt(j.kind, jobDims(j)) + ' at ' + money(num(j.unit)) + ', total ' + cents(t.tot));
    j.lane = 'quoted'; j.quoteAt = 'just now'; j.noteQ = 'Quote sent just now'; j.warn = false; j.est = { tot: t.tot, at: nowT(), rev: j.rev || 1 };
    log('Estimate copy emailed to Tricia (pending approval): ' + j.cust + ', ' + cents(t.tot));
    render(); toast('Quote emailed to ' + j.person + '. An estimate copy went to Tricia and shows as pending approval. The job is in Quoted.');
  },
  useEng: function (el) { var j = jobBy(el.dataset.id), e = jobEng(j); if (!e.ok) return; j.unit = e.each.toFixed(2); log('Estimate from pricing engine: ' + j.cust + ', ' + itemLabel(j) + ' at ' + money(e.each)); render(); toast('Price set from the pricing engine: ' + money(e.each) + ' each. You can still change it.'); },
  loadEx: function () { loadExample(); render(); toast('Example numbers loaded so you can see it work. Replace them with yours.'); },
  clearEng: function () { S.eng.bend = S.eng.hem = S.eng.markup = S.eng.rush = S.eng.min = ''; S.eng.mats.forEach(function (m) { m.cost = ''; }); log('Pricing engine: all numbers cleared'); render(); },
  addMat: function () { var id = 1; S.eng.mats.forEach(function (m) { id = Math.max(id, m.id + 1); }); S.eng.mats.push({ id: id, name: 'New material', cost: '' }); render(); },
  delMat: function (el) { S.eng.mats = S.eng.mats.filter(function (m) { return m.id !== Number(el.dataset.id); }); render(); },
  follow: function (el) { S.modal = { type: 'follow', id: Number(el.dataset.id) }; render(); },
  followOk: function () { var j = jobBy(S.modal.id); S.modal = null; j.warn = false; j.noteQ = 'Followed up just now'; log('Follow-up emailed to ' + j.person + ', ' + j.cust); render(); toast('Follow-up sent to ' + j.person + '.'); },
  phoneOk: function (el) { var j = jobBy(el.dataset.id); approve(j, 'by phone, just now'); render(); toast('Moved to Approved. Tricia\'s estimate moved from pending to approved.'); },
  simApprove: function (el) { var j = jobBy(el.dataset.id); approve(j, 'just now'); render(); toast(j.person + ' clicked Approve. The job lit up on the Workbench and Tricia\'s estimate moved to approved.'); },
  machine: function (el) { var j = jobBy(el.dataset.id); toMachine(j); render(); },
  sched: function (el) { var j = jobBy(el.dataset.id); S.modal = { type: 'sched', id: j.n, day: j.day || 'mon', win: j.win || '8–10 AM' }; render(); },
  mDay: function (el) { S.modal.day = el.dataset.v; render(); },
  mWin: function (el) { S.modal.win = el.dataset.v; render(); },
  schedOk: function () { var m = S.modal, j = jobBy(m.id); j.day = m.day; j.win = m.win; S.modal = null; render(); toast(j.cust + ': delivery set for ' + dayLabel(j.day) + ', ' + j.win + '. The customer is notified.'); },
  modalClose: function () { S.modal = null; render(); },
  modalBg: function (el, e) { if (e.target === el) { S.modal = null; render(); } },
  docq: function (el) { S.modal = { type: 'doc', kind: 'quote', id: Number(el.dataset.id) }; render(); },
  doci: function (el) { var j = jobBy(el.dataset.id); S.modal = { type: 'doc', kind: 'inv', id: j.n }; render(); },
  delivered: function (el) { var j = jobBy(el.dataset.id); j.lane = 'done'; j.doneAt = 'Thu, Oct 1'; j.shop = ''; S.fin = S.fin.filter(function (n) { return n !== j.n; }); S.queue = S.queue.filter(function (n) { return n !== j.n; }); log('Delivered: ' + j.cust + ', ' + itemLabel(j)); render(); toast(j.cust + ': delivered. The job moved to Done. The invoice already went to ' + j.person + ' when the shop finished it.'); },
  openop: function (el) { var j = jobBy(el.dataset.id); if (el.dataset.start && j.shop === 'queued') { j.shop = 'bending'; } go('op', j.n); if (el.dataset.start) toast('Bending started. This is the operator view. Press the expand button in the corner of the drawing to take over the whole display.'); },
  start: function (el) { var j = jobBy(el.dataset.id); j.shop = 'bending'; render(); },
  finish: function (el) {
    var j = jobBy(el.dataset.id); j.shop = 'finished'; S.queue = S.queue.filter(function (n) { return n !== j.n; }); if (S.fin.indexOf(j.n) < 0) S.fin.push(j.n);
    if (!j.day) { j.day = 'fri'; j.win = '8–10 AM'; }
    if (!j.inv) j.inv = { no: S.invSeq++, sent: false };
    j.inv.sent = true; j.inv.at = nowT();
    var t = totals(j), est = j.est ? j.est.tot : t.tot, diff = t.tot - est, why = '', okA = j.adds.filter(function (a) { return a.st === 'ok'; }), waitA = j.adds.filter(function (a) { return a.st === 'wait'; });
    if (j.rev > 1) why += 'Revised quote v' + j.rev + '. ';
    if (okA.length) why += 'Includes addendum ' + okA.map(function (a) { return a.no; }).join(', ') + '. ';
    j.recon = { est: est, final: t.tot, diff: diff, why: why.trim() };
    log('Marked finished: ' + j.cust + ', ' + itemLabel(j) + '. Invoice #' + j.inv.no + ' emailed to ' + j.person + '. Final invoice with reconciliation sent to Tricia: estimate ' + cents(est) + ', final ' + cents(t.tot) + (diff ? ', difference ' + (diff > 0 ? '+' : '-') + cents(Math.abs(diff)) : ', no difference'));
    render(); toast('Invoice #' + j.inv.no + ' emailed to ' + j.person + '. Final invoice and reconciliation sent to Tricia (' + (diff ? 'difference ' + (diff > 0 ? '+' : '−') + cents(Math.abs(diff)) : 'no difference from the estimate') + '). Delivery set for ' + dayLabel(j.day) + ', ' + j.win + '.' + (waitA.length ? ' Addendum ' + waitA[0].no + ' is still waiting for approval and is not on this invoice.' : ''));
  },
  opFull: function () {
    S.opFull = !S.opFull;
    try { if (S.opFull) { if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function () {}); } else if (document.fullscreenElement) document.exitFullscreen(); } catch (er) {}
    render();
  },
  opBack: function () { go('shop'); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (er) {} },
  addNote: function (el) {
    var inp = document.getElementById('note-' + el.dataset.id), j = jobBy(el.dataset.id), v = inp ? inp.value.trim() : '';
    if (!v) { toast('Type the note first.'); return; }
    j.notes.push({ who: 'Steve', t: nowT(), txt: v }); log('Note sent to the shop on ' + j.cust + ' ' + itemLabel(j) + ': ' + v); render(); toast('Note sent. It shows on the operator screen.');
  },
  reorder: function (el) {
    var o = jobBy(el.dataset.id), j = makeJob({ cust: o.cust, kind: o.kind, pid: o.pid, qty: o.qty, spec: o.spec, src: 'Reorder', age: 'Just now' });
    go('job', j.n); toast('Reorder started as ' + jid(j.n) + ' with the same profile, material and quantity.');
  },
  srcSel: function (el) { S.src.sel = Number(el.dataset.v); render(); },
  srcTab: function (el) { S.src.tab = Number(el.dataset.v); render(); },
  useReading: function (el) { go('job', Number(el.dataset.id)); toast('Reading accepted. Check the highlighted items, then price the quote.'); },
  selectProf: function (el) {
    var p = profBy(el.dataset.id), j = makeJob({ cust: p.cust, kind: p.kind, pid: p.id, qty: 10, spec: p.mats[0].spec, src: S.route.page === 'newquote' ? 'Desk' : 'Search' });
    go('job', j.n); toast('New quote started for ' + p.cust + ' from this saved profile. Set the quantity and price.');
  },
  custPick: function (el) { S.cust.sel = el.dataset.v; S.cust.edit = false; render(); },
  editContact: function () { S.cust.edit = !S.cust.edit; render(); },
  saveContact: function () { S.cust.over[S.cust.sel] = { person: document.getElementById('ce-person').value, email: document.getElementById('ce-email').value }; S.cust.edit = false; render(); toast('Contact saved.'); },
  setSec: function (el) { S.setSec = el.dataset.v; render(); },
  tg: function (el) { S.tg[el.dataset.v] = !S.tg[el.dataset.v]; render(); },
  fd: function (el) {
    var j = jobBy(el.dataset.id), p = j.pid ? profBy(j.pid) : null;
    S.modal = { type: 'fd', job: j.n, pid: j.pid, kind: j.kind, base: p ? p.d.slice() : jobDims(j), d: jobDims(j).slice(), cust: j.cust, spec: j.spec };
    if (!p) S.modal.base = jobDims(j).slice();
    render();
  },
  fdp: function (el) { var p = profBy(el.dataset.id); S.modal = { type: 'fd', job: 0, pid: p.id, kind: p.kind, base: p.d.slice(), d: p.d.slice(), cust: p.cust, spec: p.mats[0].spec }; render(); },
  fdAdj: function (el) { var m = S.modal, i = Number(el.dataset.i); m.d[i] = Math.max(0.0625, Math.round((m.d[i] + Number(el.dataset.v)) * 16) / 16); render(); },
  fdReset: function () { var m = S.modal; m.d = m.base.slice(); render(); },
  fdApply: function () { var m = S.modal, j = jobBy(m.job); m.d[j.chg.seg] = m.base[j.chg.seg] + j.chg.delta; render(); },
  fdSave: function () {
    var m = S.modal, j = m.job ? jobBy(m.job) : null, changed = m.d.some(function (v, i) { return Math.abs(v - m.base[i]) > 1e-9; }), p = m.pid ? profBy(m.pid) : null;
    if (p && !changed) {
      S.modal = null;
      if (j) { if (j.chg && !j.chgDone) { j.chg = null; toast('Kept the saved drawing. The change request was dropped from this order.'); } else toast('No changes. The saved drawing is used as is.'); render(); }
      else { render(); toast('No changes to save.'); }
      return;
    }
    var np = { id: newProfileId(), kind: m.kind, cust: m.cust, person: personOf(m.cust), d: m.d.slice(), paint: p ? p.paint : 'Up', ver: p ? p.ver + 1 : 1, parent: p ? p.id : 0, mats: [{ spec: m.spec, first: 'Oct 1', last: 'Oct 1', orders: j ? 1 : 0, pcs: j ? Math.floor(num(j.qty)) : 0 }] };
    PROFILES.push(np);
    log('FlashDraft: ' + (p ? 'new version of profile #' + p.id : 'new profile') + ' saved as #' + np.id + ' for ' + m.cust + ', ' + dimTxt(np.kind, np.d));
    S.modal = null;
    if (j) {
      j.pid = np.id;
      if (p) { j.chgDone = true; if (!j.chg) { var k = 0; for (var i = 0; i < m.d.length; i++) if (Math.abs(m.d[i] - m.base[i]) > 1e-9) { k = i; break; } j.chg = { seg: k, delta: m.d[k] - m.base[k], text: 'Edited in FlashDraft' }; } }
      render(); toast('Saved in FlashDraft as profile #' + np.id + (p ? ' (version ' + np.ver + ' of #' + p.id + ')' : '') + ' and linked to this order.');
    } else { render(); toast('Saved as version ' + np.ver + ' (profile #' + np.id + '). The original is untouched.'); }
  }
};
function syncLineBtns() { var b = document.getElementById('ln-black'), r = document.getElementById('ln-red'); if (b) b.className = S.line === 'black' ? 'on' : ''; if (r) r.className = S.line === 'red' ? 'on' : ''; }

document.addEventListener('click', function (e) {
  hidePeek();
  var mm = document.getElementById('mm');
  if (mm && !mm.hidden && !(e.target.closest && e.target.closest('.more'))) mm.hidden = true;
  var hs = document.getElementById('hsd');
  if (hs && !hs.hidden && !(e.target.closest && e.target.closest('.hs'))) hs.hidden = true;
  var g = e.target.closest ? e.target.closest('[data-go]') : null;
  var a = e.target.closest ? e.target.closest('[data-act]') : null;
  if (a) {
    if (a.tagName === 'A') e.preventDefault();
    if (A[a.dataset.act]) { A[a.dataset.act](a, e); return; }
  }
  if (g) {
    e.preventDefault();
    var v = g.dataset.go.split(':'), pg = v[0], id = v[1] ? Number(v[1]) : undefined;
    if (pg === 'prof') { S.search = searchDef(); S.search.pid = id; go('search'); return; }
    go(pg, id);
  }
});
function calcRefresh() { var c = document.getElementById('calcout'); if (c) c.innerHTML = calcOut(); }
document.addEventListener('input', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-in'); if (!k) return;
  var j = S.route.page === 'job' ? jobBy(S.route.id) : null;
  if (k === 'qty' && j) { j.qty = t.value.replace(/[^0-9]/g, ''); updateQuote(j); }
  else if (k === 'unit' && j) { j.unit = t.value; updateQuote(j); }
  else if (k === 'sq') { S.search.q = t.value; refreshSearch(); }
  else if (k === 'hq') hqShow(t.value);
  else if (k === 'nq') { S.nq.q = t.value; refreshNq(); }
  else if (k === 'nqco') S.nq.co = t.value;
  else if (k === 'nqpe') S.nq.person = t.value;
  else if (k === 'nqem') S.nq.email = t.value;
  else if (k === 'lq') { S.ls[S.route.page].q = t.value; refreshList(); }
  else if (k === 'eng') { S.eng[t.dataset.k] = t.value; calcRefresh(); }
  else if (k === 'matname') { S.eng.mats.forEach(function (m) { if (m.id === Number(t.dataset.id)) m.name = t.value; }); }
  else if (k === 'matcost') { S.eng.mats.forEach(function (m) { if (m.id === Number(t.dataset.id)) m.cost = t.value; }); calcRefresh(); }
  else if (k === 'cqty') { S.eng.calc.qty = t.value.replace(/[^0-9]/g, ''); calcRefresh(); }
});
document.addEventListener('change', function (e) {
  var t = e.target, k = t.getAttribute && t.getAttribute('data-in'); if (!k) return;
  if (k.indexOf('s_') === 0) { S.search[k.slice(2)] = t.value; refreshSearch(); }
  else if (k === 'ls') { S.ls[S.route.page][t.dataset.k] = t.value; refreshList(); }
  else if (k === 'nqkind') S.nq.kind = t.value;
  else if (k === 'eng') { log('Pricing engine: ' + engLabel(t.dataset.k) + ' set to ' + (t.value || 'blank')); }
  else if (k === 'matcost') { var nm = ''; S.eng.mats.forEach(function (m) { if (m.id === Number(t.dataset.id)) nm = m.name; }); log('Pricing engine: sheet cost for ' + nm + ' set to $' + (t.value || 'blank')); }
  else if (k === 'cpid') { S.eng.calc.pid = Number(t.value); render(); }
  else if (k === 'cspec') { S.eng.calc.spec = t.value; calcRefresh(); }
  else if (k === 'crush') { S.eng.calc.rush = t.checked; calcRefresh(); }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { if (S.modal) { S.modal = null; render(); } else if (S.opFull) { S.opFull = false; render(); } }
  if (e.key === 'Enter' && e.target && e.target.id === 'hq') { S.search = searchDef(); S.search.q = e.target.value; go('search'); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('mrow')) { e.preventDefault(); A.mailOpen(e.target); }
});
document.addEventListener('fullscreenchange', function () { if (!document.fullscreenElement && S.opFull) { S.opFull = false; render(); } });

render();
window.__afs = { get: function () { return S; }, go: go, profiles: function () { return PROFILES; } };
})();
</script>
</body></html>
