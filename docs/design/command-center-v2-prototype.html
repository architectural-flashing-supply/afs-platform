<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AFS Command Center — Clickable Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --header:#2E3238; --header-2:#22262B; --header-line:#8A9099; --on-header:#FFFFFF;
  --bg:#EDEFF1; --lane:#E1E5E9; --surface:#FFFFFF; --sunk:#F4F5F7; --line:#CDD2D8; --line-strong:#8C939B;
  --text:#15181C; --text-2:#434A53;
  --red:#B3122B; --red-hover:#8F0E22; --on-red:#FFFFFF;
  --green:#1E7F45; --green-soft:#E3F2E9; --on-green:#FFFFFF;
  --amber-bg:#FFF1B8; --amber-text:#7A4200;
  --focus:#0B5FFF;
  --shadow:0 10px 30px rgba(21,24,28,.14);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --header:#1B1E22; --header-2:#14171A; --header-line:#6B737C; --on-header:#FFFFFF;
    --bg:#121417; --lane:#191C20; --surface:#1F2328; --sunk:#16191D; --line:#353B43; --line-strong:#7A838D;
    --text:#F2F4F6; --text-2:#C7CDD4;
    --red:#C8102E; --red-hover:#A30D25; --on-red:#FFFFFF;
    --green:#1E7F45; --green-soft:#16301F; --on-green:#FFFFFF;
    --amber-bg:#4A3A06; --amber-text:#FFE08A;
    --focus:#6EA8FF; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --header:#1B1E22; --header-2:#14171A; --header-line:#6B737C; --on-header:#FFFFFF;
  --bg:#121417; --lane:#191C20; --surface:#1F2328; --sunk:#16191D; --line:#353B43; --line-strong:#7A838D;
  --text:#F2F4F6; --text-2:#C7CDD4;
  --red:#C8102E; --red-hover:#A30D25; --on-red:#FFFFFF;
  --green:#1E7F45; --green-soft:#16301F; --on-green:#FFFFFF;
  --amber-bg:#4A3A06; --amber-text:#FFE08A;
  --focus:#6EA8FF; --shadow:0 10px 30px rgba(0,0,0,.5);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;margin:0;line-height:1.1}
svg{max-width:100%}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--header);color:var(--on-header)}
.top-in{display:flex;align-items:center;gap:28px;padding:0 32px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;background:none;border:0;color:var(--on-header);cursor:pointer;padding:0}
.brand b{font-family:"Barlow Condensed",sans-serif;font-size:28px}
.brand span{font-family:"Barlow Condensed",sans-serif;font-size:15px;font-weight:600;letter-spacing:.06em}
.nav{display:flex;gap:4px;align-items:stretch}
.nav button{background:none;border:0;color:var(--on-header);padding:20px 12px 17px;border-bottom:3px solid transparent;cursor:pointer;font-weight:500}
.nav button[aria-current="page"]{border-bottom-color:#E0263D;font-weight:700}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;position:relative}
.top-right label{font-size:14px}
.top-right input{width:260px;height:40px;border:1px solid var(--header-line);border-radius:6px;background:var(--header-2);color:var(--on-header);padding:0 12px}
.top-right input::placeholder{color:#D5D9DF;opacity:1}
.ghost-dark{height:40px;padding:0 14px;background:transparent;color:var(--on-header);border:1px solid var(--header-line);border-radius:6px;cursor:pointer}
.menu{position:absolute;right:0;top:48px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:200px;padding:6px;display:flex;flex-direction:column}
.menu button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--sunk)}

main{padding:24px 32px 40px;max-width:1600px;margin:0 auto}
.muted{color:var(--text-2)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* buttons */
.btn{min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn-red{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn-red:hover{background:var(--red-hover)}
.btn-green{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn-green:hover{filter:brightness(.92);background:var(--green)}
.btn-big{min-height:56px;font-size:19px;width:100%}
.link{background:none;border:0;color:var(--red);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

/* summary */
.hello{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:34px}
.chip{border-radius:999px;padding:7px 14px;font-size:15px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.chip-green{background:var(--green);border-color:var(--green);color:var(--on-green)}

/* lanes */
.lanes{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.lane{background:var(--lane);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:420px}
.lane-head{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 0}
.lane-head h2{font-size:22px}
.count{min-width:28px;height:28px;border-radius:14px;background:var(--text);color:var(--bg);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 8px}
.count.go{background:var(--green);color:var(--on-green)}
.lane-sub{font-size:14px;color:var(--text-2);padding:0 4px 4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column}
.card.approved{border:2px solid var(--green)}
.card-main{background:none;border:0;text-align:left;padding:12px 14px 6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-radius:10px 10px 0 0}
.card-main:hover .card-cust{text-decoration:underline}
.card-top{display:flex;gap:8px;align-items:center}
.src{width:28px;height:28px;border-radius:6px;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-cust{font-weight:700;font-size:15px;line-height:1.2}
.card-title{font-size:15px}
.card-meta{font-size:13px;font-weight:600;color:var(--text-2)}
.card-meta.warn{color:var(--amber-text)}
.card-meta.good{color:var(--green)}
.card-act{padding:6px 14px 14px}
.card-act .btn{width:100%;min-height:40px}
.beacon{animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,127,69,.55)}70%{box-shadow:0 0 0 12px rgba(30,127,69,0)}100%{box-shadow:0 0 0 0 rgba(30,127,69,0)}}
@media (prefers-reduced-motion: reduce){.beacon{animation:none}}
.empty{font-size:14px;color:var(--text-2);padding:8px 4px}

/* job */
.back{margin-bottom:6px}
.job-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.job-head h1{font-size:34px}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.steps li.done{background:var(--sunk);color:var(--text-2)}
.steps li.now{background:var(--red);border-color:var(--red);color:var(--on-red)}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1100px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-size:24px}
.panel h3{font-family:Barlow,sans-serif;font-size:15px;font-weight:700}
.quote-box{background:var(--sunk);border-radius:8px;padding:14px 16px;font-size:16px}
dl.read{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0;font-size:15px}
dl.read dt{color:var(--text-2)}
dl.read dd{margin:0;font-weight:600}
dl.read dd.unsure{background:var(--amber-bg);color:var(--amber-text);border-radius:4px;padding:1px 8px}
.drawing{background:var(--sunk);border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:240px}
.drawing path{stroke:var(--text)}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.thumb{height:72px;background:var(--sunk);border:1px solid var(--line);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.thumb path{stroke:var(--text)}
table.q{width:100%;border-collapse:collapse;font-size:15px}
table.q th{text-align:left;font-size:13px;color:var(--text-2);font-weight:600;padding-bottom:6px}
table.q td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
table.q tr.total td{border-top:2px solid var(--text);font-weight:700}
.num{text-align:right}
.qty{width:70px;height:36px;border:1px solid var(--line-strong);border-radius:6px;padding:0 8px;background:var(--surface)}
.status{border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.status.green{background:var(--green-soft)}
.status.gray{background:var(--sunk)}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check svg{flex-shrink:0}
.photo{height:140px;border-radius:8px;background:var(--sunk);border:1px dashed var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* search */
.search-wrap{display:grid;grid-template-columns:300px 150px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.search-wrap{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.field input,.field select,.field textarea{min-height:44px;border:1px solid var(--line-strong);border-radius:6px;padding:0 12px;background:var(--surface)}
.field textarea{padding:10px 12px;min-height:150px;resize:vertical}
.field input::placeholder{color:var(--text-2);opacity:1}
.rail{display:flex;flex-direction:column;gap:10px;max-height:640px;overflow-y:auto;padding:2px}
.rail button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.rail button[aria-pressed="true"]{border:2px solid var(--red)}
.rail button path{stroke:var(--text)}
.rail span{font-size:13px;font-weight:600;text-align:center;line-height:1.2}
.same{font-size:12px;color:var(--text-2)}

/* shop + deliveries + tables */
.list{display:flex;flex-direction:column;gap:12px}
.shop-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:56px 140px minmax(0,1fr) auto;gap:18px;align-items:center}
@media (max-width:900px){.shop-card{grid-template-columns:1fr}}
.qnum{font-family:"Barlow Condensed",sans-serif;font-size:40px;font-weight:700;text-align:center}
.mini{height:110px;background:var(--sunk);border-radius:8px;display:flex;align-items:center;justify-content:center}
.mini path{stroke:var(--text)}
.week{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:12px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:260px;display:flex;flex-direction:column;gap:10px}
.day h3{font-family:Barlow,sans-serif;font-size:15px;font-weight:700}
.stop{background:var(--sunk);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table.t th{text-align:left;font-size:13px;color:var(--text-2);font-weight:600;padding:10px 14px;background:var(--sunk)}
table.t td{padding:12px 14px;border-top:1px solid var(--line)}
.tscroll{overflow-x:auto}
.cell-in{width:110px;height:36px;border:1px solid var(--line-strong);border-radius:6px;padding:0 8px;background:var(--surface)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--sunk);border:1px solid var(--line)}
.pill.new{background:var(--red);border-color:var(--red);color:var(--on-red)}
.pill.approved{background:var(--green);border-color:var(--green);color:var(--on-green)}
.soon{border:1px dashed var(--line-strong);border-radius:10px;padding:16px;background:var(--surface)}
.page-title{font-size:34px;margin-bottom:14px}
.section{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.section h2{font-size:24px}
.switch{display:flex;gap:10px;align-items:center;font-weight:600}
.switch input{width:20px;height:20px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,14,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.modal.wide{width:min(1000px,100%)}
.modal h2{font-size:26px}
.fd-tools{display:flex;gap:8px;flex-wrap:wrap}
.fd-tools span{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;background:var(--sunk)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);border-radius:10px;padding:12px 16px;display:flex;gap:16px;align-items:center;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;cursor:pointer}
.proto{font-size:13px;color:var(--text-2);text-align:center;margin-top:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

  var inner="";
  if(m.type==="fd"){
    inner='<h2>FlashDraft</h2><p class="muted" style="margin:0">'+esc(m.name)+' is loaded as a new draft. The original stays untouched.</p>'+
      '<div class="fd-tools"><span>Draw</span><span>Select</span><span>Hem</span><span>Undo</span><span>2D</span><span>3D</span></div>'+
      '<div class="drawing" style="min-height:360px">'+draw(m.key,320)+'</div><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn btn-red" data-act="fdsave">Use this profile</button></div>';
  }
  if(m.type==="followup"){
    var j=job(m.id);
    inner='<h2>Follow up with '+esc(j.contact)+'</h2><div class="field"><label for="fu">Message</label><textarea id="fu">Hi '+esc(j.contact)+', just checking in on the quote for '+j.qty+' '+esc(j.item.toLowerCase())+'. You can approve it right from the original email, or reply here with any changes.</textarea></div>'+
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn btn-red" data-act="sendfollow" data-id="'+j.id+'">Send follow-up</button></div>';
  }
  if(m.type==="schedule"){
    var k=job(m.id); var days=["Thu, Oct 1","Fri, Oct 2","Mon, Oct 5","Tue, Oct 6","Wed, Oct 7"], wins=["8–10 AM","10 AM–12 PM","1–3 PM","3–5 PM"];
    inner='<h2>Schedule delivery</h2><p style="margin:0"><b>'+esc(k.customer)+'</b>, '+esc(k.item)+' × '+k.qty+'</p>'+
      '<div class="two"><div class="field"><label for="dd">Day</label><select id="dd">'+days.map(function(d){return '<option'+(k.delivery&&k.delivery.day===d?' selected':'')+'>'+d+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label for="dw">Time window</label><select id="dw">'+wins.map(function(w){return '<option'+(k.delivery&&k.delivery.win===w?' selected':'')+'>'+w+'</option>';}).join("")+'</select></div></div>'+
      '<label class="switch"><input type="checkbox" checked> Text and email '+esc(k.contact)+' a tracking link</label>'+
      '<div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Cancel</button><button class="btn btn-red" data-act="dosched" data-id="'+k.id+'">Schedule delivery</button></div>';
  }
  return '<div class="scrim" data-act="scrim"><div class="modal'+(m.type==="fd"?" wide":"")+'" role="dialog" aria-modal="true">'+inner+'</div></div>';
}

function toast(){ if(!S.toast) return ""; return '<div class="toast" role="status"><span>'+esc(S.toast.text)+'</span>'+(S.toast.undo?'<button data-act="undo">Undo</button>':'')+'</div>'; }

function render(){
  var body={workbench:workbench,job:jobView,search:searchView,shop:shopView,deliveries:deliveriesView,customers:customersView,settings:settingsView}[S.view]();
  document.getElementById("app").innerHTML=header()+'<main>'+body+'<p class="proto">Clickable prototype with sample jobs. Nothing here sends a real email or reaches the machine.</p></main>'+modal()+toast();
}

function say(text,undo){ S.toast={text:text,undo:!!undo}; clearTimeout(toastTimer); toastTimer=setTimeout(function(){S.toast=null;undoSnap=null;render();},9000); }
function go(v){ S.view=v; S.menu=false; S.custName=null; window.scrollTo(0,0); render(); }

document.addEventListener("click",function(e){
  var t=e.target.closest("[data-go],[data-open],[data-act],[data-hover],[data-cust]"); if(!t) { if(S.menu){S.menu=false;render();} return; }
  if(t.dataset.go){ go(t.dataset.go); return; }
  if(t.dataset.open){ S.jobId=t.dataset.open; go("job"); return; }
  if(t.dataset.cust){ S.view="customers"; S.custName=t.dataset.cust; S.menu=false; render(); return; }
  if(t.dataset.hover){ S.hover=t.dataset.hover; render(); return; }
  var a=t.dataset.act, id=t.dataset.id, j=id?job(id):null;
  if(a==="menu"){ S.menu=!S.menu; render(); return; }
  if(a==="scrim"){ if(e.target===t){ S.modal=null; render(); } return; }
  if(a==="close"){ S.modal=null; render(); return; }
  if(a==="fd"){ S.modal={type:"fd",key:t.dataset.key,name:t.dataset.name}; render(); return; }
  if(a==="fdsave"){ S.modal=null; say("Profile loaded into FlashDraft as a new draft."); render(); return; }
  if(a==="draft"){ say("Draft saved."); render(); return; }
  if(a==="followup"){ S.modal={type:"followup",id:id}; render(); return; }
  if(a==="sendfollow"){ j.sent="just now"; j.stale=false; S.modal=null; say("Follow-up sent to "+j.contact+"."); render(); return; }
  if(a==="schedule"){ S.modal={type:"schedule",id:id}; render(); return; }
  if(a==="dosched"){ j.delivery={day:document.getElementById("dd").value,win:document.getElementById("dw").value}; S.modal=null; say("Delivery scheduled for "+j.delivery.day+", "+j.delivery.win+". "+j.contact+" was notified."); render(); return; }
  if(a==="undo"){ if(undoSnap){ jobs=JSON.parse(undoSnap); undoSnap=null; } S.toast=null; render(); return; }
  if(a==="sendquote"){ undoSnap=snapshot(); j.stage="quoted"; j.sent="just now"; j.stale=false; say("Quote sent to "+j.contact+".",true); go("workbench"); return; }
  if(a==="markapproved"){ j.stage="approved"; j.approved="just now"; say("Marked approved. Invoice emailed to Tricia."); render(); return; }
  if(a==="send"){ undoSnap=snapshot(); j.stage="shop"; j.shop="queued"; j.pe=String(32960130+Math.floor(Math.random()*60)); say("Sent to the machine as profile #"+j.pe+".",true); if(S.view==="job"){render();}else{render();} return; }
  if(a==="start"){ j.shop="bending"; say(j.item+" is bending now."); render(); return; }
  if(a==="complete"){ j.shop="complete"; if(!j.delivery){ j.delivery={day:"Fri, Oct 2",win:"8–10 AM"}; } say("Marked finished. Delivery set for "+j.delivery.day+", "+j.delivery.win+", and "+j.contact+" was notified."); render(); return; }
  if(a==="delivered"){ j.stage="done"; j.delivered="today"; say(j.customer+" marked delivered."); render(); return; }
  if(a==="reorder"){ var n=JSON.parse(JSON.stringify(j)); n.id=j.id+"r"+Date.now(); n.stage="new"; n.age="just now"; n.source="email"; delete n.delivery; delete n.delivered; jobs.unshift(n); S.jobId=n.id; say("Reorder started from "+j.customer+"'s last job."); render(); return; }
});
document.addEventListener("mouseover",function(e){ var t=e.target.closest("[data-hover]"); if(t && S.hover!==t.dataset.hover){ S.hover=t.dataset.hover; render(); var b=document.querySelector('[data-hover="'+S.hover+'"]'); if(b) b.focus({preventScroll:true}); } });
document.addEventListener("keydown",function(e){
  if(e.target && e.target.id==="topq" && e.key==="Enter"){ S.q=e.target.value; S.view="search"; S.menu=false; render(); var el=document.getElementById("sq"); if(el){el.focus(); el.setSelectionRange(el.value.length,el.value.length);} }
  if(e.key==="Escape" && (S.modal||S.menu)){ S.modal=null; S.menu=false; render(); }
});
document.addEventListener("input",function(e){
  if(e.target.id==="sq"){ S.q=e.target.value; render(); var el=document.getElementById("sq"); el.focus(); el.setSelectionRange(el.value.length,el.value.length); }
  if(e.target.dataset && e.target.dataset.qty){ var j=job(e.target.dataset.qty); var v=parseInt(e.target.value,10); if(v>0) j.qty=v; }
});
document.addEventListener("change",function(e){
  if(e.target.id==="sf"){ S.field=e.target.value; render(); }
  if(e.target.id==="sm"){ S.mat=e.target.value; render(); }
});
render();
})();
</script>
</body>
</html>
